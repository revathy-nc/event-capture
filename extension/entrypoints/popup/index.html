<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Capture</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      body {
        margin: 0;
        padding: 14px 16px;
        width: 300px;
        font-size: 13px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #8884;
        background: #8882;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        border-color: #2563eb;
        color: white;
      }
      button.danger {
        background: #dc2626;
        border-color: #dc2626;
        color: white;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 10px 0;
      }
      dt {
        opacity: 0.7;
      }
      dd {
        margin: 0;
        text-align: right;
      }
      .muted {
        opacity: 0.65;
      }
      a {
        color: inherit;
      }
      #message {
        min-height: 16px;
        margin-bottom: 6px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>Event Capture <span id="version" class="muted" style="font-weight: 400; font-size: 11px"></span></h1>
    <div class="row">
      <span id="state" class="muted">loading…</span>
      <button id="toggle" class="primary">Enable</button>
    </div>
    <div class="row">
      <span id="host" class="muted">—</span>
      <button id="allow">Allow site</button>
    </div>
    <dl>
      <dt>Stored events</dt>
      <dd id="stored">0</dd>
    </dl>
    <div id="message"></div>
    <div class="row">
      <button id="export" class="primary" style="flex: 1">Export CSV</button>
      <button id="clear" class="danger">Clear</button>
    </div>
    <div class="row" style="margin-top: 8px">
      <a href="#" id="options">Options</a>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
